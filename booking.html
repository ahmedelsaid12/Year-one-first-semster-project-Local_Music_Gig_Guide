<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Gig | SoundWave City</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
<a class="visually-hidden-focusable skip-link" href="#main">Skip to main content</a>
<nav class="navbar navbar-expand-lg bg-body-tertiary" aria-label="Main navigation">
 <div class="container">
  <a class="navbar-brand brand" href="index.html">SoundWave City</a>
  <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
  <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="index.html">Home</a></li><li class="nav-item"><a class="nav-link" href="gigs.html">Gig Feed</a></li><li class="nav-item"><a class="nav-link" href="venue.html">Venue Detail</a></li><li class="nav-item"><a class="nav-link active" href="booking.html" aria-current="page">Book a Gig</a></li></ul></div>
 </div>
</nav>
</header>
<main id="main">
<section class="container my-4" aria-labelledby="bk">
 <div class="row justify-content-center"><div class="col-12 col-md-10 col-lg-7">
  <h1 id="bk" class="section-title">Booking Request</h1>
  <p class="text-secondary">Bands: tell the venue promoter when you would like to play.</p>
  <form action="#" method="post" class="card p-4">
   <div class="mb-3"><label for="band" class="form-label">Band name</label><input type="text" class="form-control" id="band" name="band" required></div>
   <div class="mb-3"><label for="genre" class="form-label">Music genre</label><select class="form-select" id="genre" name="genre" required><option value="">Choose a genre</option><option>Synthpop</option><option>Heavy Metal</option><option>Jazz</option><option>Indie Rock</option><option>Other</option></select></div>
   <div class="mb-3"><label for="venue" class="form-label">Venue</label><select class="form-select" id="venue" name="venue" required><option value="">Choose a venue</option><option>The Blue Note</option><option>The Foundry</option><option>Acoustic Lounge</option></select></div>
   <div class="mb-3"><label for="date" class="form-label">Preferred date</label><input type="date" class="form-control" id="date" name="date" required></div>
   <div class="mb-3"><label for="email" class="form-label">Contact email</label><input type="email" class="form-control" id="email" name="email" required></div>
   <div class="mb-3"><label for="msg" class="form-label">Message (optional)</label><textarea class="form-control" id="msg" name="msg" rows="3"></textarea></div>
   <button type="submit" class="btn btn-primary btn-lg">Send request</button>
  </form>
 </div></div>
</section>
</main>
<footer class="py-4 mt-5 border-top">
 <div class="container text-center small text-secondary">
  <p class="mb-1">SoundWave City &middot; City Live Music Association</p>
  <p class="mb-0">Milestone 1 &ndash; Frontend wireframe-level build</p>
 </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
